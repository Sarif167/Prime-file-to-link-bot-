<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{{file_name}} - PRIME NETWORK</title>

<link rel="icon" href="https://i.ibb.co/Hh4kF2b/icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

<script src="https://cdn.tailwindcss.com"></script>

<style>

:root{
    --bg-body:#0b0f15;
    --bg-card:#121824;
    --bg-btn:#1a2232;
    --text:#ffffff;
    --accent:#00e5ff;
}

body{
    margin:0;
    padding:0;
    background:var(--bg-body);
    color:var(--text);
    font-family:'Poppins',sans-serif;
    padding-bottom:100px;
}

.main-container{
    width:100%;
    max-width:650px;
    margin:auto;
    padding:15px;
}

.header{
    text-align:center;
    padding-top:60px;
    padding-bottom:20px;
}

.header h1{
    font-size:35px;
    font-weight:800;
}

.card{
    background:var(--bg-card);
    border-radius:18px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.08);
}

.title-box{
    padding:15px;
    border-bottom:1px solid rgba(255,255,255,0.08);
}

.title-box h2{
    font-size:14px;
    color:var(--accent);
    word-break:break-word;
}

.video-container{
    position:relative;
    width:100%;
    background:#000;
}

#player{
    width:100%;
    height:100%;
}

.info{
    display:flex;
    justify-content:space-between;
    padding:12px 16px;
    font-size:12px;
    font-weight:700;
}

.btn-grid{
    margin-top:20px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.btn-grid-3{
    margin-top:12px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.btn{
    border:none;
    border-radius:50px;
    padding:12px;
    cursor:pointer;
    font-weight:700;
    transition:0.3s;
}

.btn:hover{
    transform:translateY(-2px);
}

.red{
    background:#e11d48;
    color:#fff;
}

.blue{
    background:#2563eb;
    color:#fff;
}

.dark{
    background:var(--bg-btn);
    color:#fff;
    border:1px solid rgba(255,255,255,0.08);
}

.footer{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:#0b0f15;
    text-align:center;
    padding:12px;
    font-size:11px;
    border-top:1px solid rgba(255,255,255,0.08);
    z-index:999;
}

.footer a{
    color:var(--accent);
    text-decoration:none;
}

.theme-btn{
    position:fixed;
    top:15px;
    right:15px;
    z-index:999;
    background:var(--bg-card);
    border:2px solid var(--accent);
    color:#fff;
    border-radius:50px;
    padding:10px 14px;
    cursor:pointer;
}

.plyr--video{
    border-radius:0;
}

</style>
</head>

<body>

<button class="theme-btn" onclick="toggleTheme()">
    <i class="fa-solid fa-circle-half-stroke"></i>
</button>

<div class="main-container">

<div class="header">
    <h1>
        <span style="color:#ff4da6;">PRIME</span>
        <span style="color:#00e5ff;">NETWORK</span>
    </h1>
</div>

<div class="card">

<div class="title-box">
    <h2>
        <i class="fas fa-play-circle"></i>
        {{file_name}}
    </h2>
</div>

<div class="video-container">

<video id="player" playsinline controls>

<source src="{{file_url}}" type="video/mp4">

</video>

</div>

<div class="info">
    <div>
        SIZE : {{file_size}}
    </div>

    <div id="clock">
        00:00:00
    </div>
</div>

</div>

<div class="btn-grid">

<button class="btn red" onclick="streamDownload()">
    <i class="fas fa-download"></i>
    DOWNLOAD
</button>

<button class="btn blue" onclick="watchOnline()">
    <i class="fas fa-play"></i>
    WATCH
</button>

</div>

<div class="btn-grid">

<button class="btn dark" onclick="vlc_player()">
    VLC PLAYER
</button>

<button class="btn dark" onclick="mx_player()">
    MX PLAYER
</button>

</div>

<div class="btn-grid">

<button class="btn dark" onclick="playit_player()">
    PLAYIT
</button>

<button class="btn dark" onclick="system_player()">
    SYSTEM
</button>

</div>

<div class="btn-grid-3">

<button class="btn dark" onclick="km_player()">
    KM
</button>

<button class="btn dark" onclick="kodi_player()">
    KODI
</button>

<button class="btn dark" onclick="n_player()">
    NPLAYER
</button>

</div>

</div>

<div class="footer">
© 2022-2026
<a href="https://t.me/PrimeXBots">
PRIMEXBOTS
</a>
</div>

<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

<script>

const fileUrl="{{file_url}}";
const fileName="{{file_name}}";

function getCleanUrl(){

let url=fileUrl.trim();

if(url.startsWith("http:https://")){
url=url.replace("http:https://","https://");
}

return url;

}

const player=new Plyr('#player',{
controls:[
'play-large',
'play',
'progress',
'current-time',
'mute',
'volume',
'settings',
'fullscreen'
]
});

function watchOnline(){

player.play();

player.fullscreen.enter();

}

function streamDownload(){

const a=document.createElement('a');

a.href=getCleanUrl();

a.download=fileName;

document.body.appendChild(a);

a.click();

document.body.removeChild(a);

}

function mx_player(){

window.location.href=
`intent:${getCleanUrl()}#Intent;action=android.intent.action.VIEW;type=video/*;package=com.mxtech.videoplayer.ad;end`;

}

function vlc_player(){

window.location.href=
`intent:${getCleanUrl()}#Intent;action=android.intent.action.VIEW;type=video/*;package=org.videolan.vlc;end`;

}

function playit_player(){

window.location.href=
`intent:${getCleanUrl()}#Intent;action=android.intent.action.VIEW;type=video/*;package=com.playit.videoplayer;end`;

}

function km_player(){

window.location.href=
`intent:${getCleanUrl()}#Intent;action=android.intent.action.VIEW;type=video/*;package=com.kmplayer;end`;

}

function kodi_player(){

window.location.href=
`intent:${getCleanUrl()}#Intent;action=android.intent.action.VIEW;type=video/*;package=org.xbmc.kodi;end`;

}

function n_player(){

window.location.href=
`intent:${getCleanUrl()}#Intent;action=android.intent.action.VIEW;type=video/*;package=com.newin.nplayer.pro;end`;

}

function system_player(){

window.open(getCleanUrl(),"_blank");

}

function toggleTheme(){

document.body.classList.toggle("light");

}

function updateClock(){

const now=new Date();

const h=String(now.getHours()).padStart(2,'0');

const m=String(now.getMinutes()).padStart(2,'0');

const s=String(now.getSeconds()).padStart(2,'0');

document.getElementById("clock").innerHTML=
`${h}:${m}:${s}`;

}

setInterval(updateClock,1000);

updateClock();

</script>

</body>
</html>
